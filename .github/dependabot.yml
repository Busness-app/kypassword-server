version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      # The shared crypto library arrives in its own PR, reviewed against the
      # capsule and recovery-key contract rather than batched with x/crypto.
      # Prefix match, so a /v2 module path or a submodule stays in this group.
      ky-primitives:
        patterns: ["github.com/Busness-app/ky-primitives*"]
      go:
        patterns: ["*"]
        exclude-patterns: ["github.com/Busness-app/ky-primitives*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Split so a React/Vite major does not sit in the same PR as a bump to
      # kdbxweb or argon2-browser, which need vault round-trip review.
      crypto:
        patterns: ["kdbxweb", "argon2-browser"]
      dev:
        dependency-type: development
      prod:
        dependency-type: production
        exclude-patterns: ["kdbxweb", "argon2-browser"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
